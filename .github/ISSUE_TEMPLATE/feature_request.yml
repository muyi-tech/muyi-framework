name: Feature Request
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢您的建议！请先搜索[已有 Issues](https://github.com/muyi-tech/muyi-framework/issues?q=) 避免重复。
        描述清楚「要解决的问题」比「要的方案」更重要——前者决定功能是否值得做。
  - type: textarea
    id: problem
    attributes:
      label: 问题场景
      description: 您想解决什么问题？现有能力为何不足？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 您期望的实现方式（含期望的 API / 配置形式，若有具体设计更佳）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 您考虑过的其他方案，或当前是如何绕过的。
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 相关文档、类似框架的实现参考等。
